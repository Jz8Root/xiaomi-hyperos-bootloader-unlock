name: Device Test Report
description: Report your unlock result to add your device to the compatibility database
title: "[DEVICE] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Fill in all fields — this data goes directly into COMPATIBILITY.md.
  - type: input
    id: device
    attributes:
      label: Device model
      description: "Full model name (e.g. Redmi Note 11S)"
      placeholder: "Redmi Note 11S"
    validations:
      required: true
  - type: input
    id: codename
    attributes:
      label: Codename
      description: "Device codename (e.g. miel, fleur, camellia)"
      placeholder: "miel"
    validations:
      required: true
  - type: input
    id: soc
    attributes:
      label: SoC
      description: "MediaTek SoC (e.g. MT6781, MT6833)"
      placeholder: "MT6781"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: "Full firmware string (e.g. HyperOS OS1.0.9.0.TKEEUXM)"
      placeholder: "HyperOS OS1.0.9.0.TKEEUXM"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Unlock result
      options:
        - SUCCESS — unlocked
        - FAILED — still locked after procedure
        - PARTIAL — unlocked but issue (describe below)
    validations:
      required: true
  - type: textarea
    id: fastboot_output
    attributes:
      label: fastboot oem lks output
      description: "Paste the output of `fastboot oem lks` and `fastboot getvar unlocked` after the procedure"
      render: shell
    validations:
      required: true
  - type: textarea
    id: commands_used
    attributes:
      label: Commands used
      description: "The exact mtkclient commands you ran (with preloader if used)"
      render: shell
    validations:
      required: true
  - type: input
    id: rpmb_sector
    attributes:
      label: RPMB sector erased (Path A only)
      description: >-
        Which sector did you erase, and how did you find it? The sector depends on the LK
        driver family, not on the SoC alone. Get yours with:
        `python3 mtk.py da rpmb r rpmb_dump.bin` then `grep -boa "Jz8PNRUF" rpmb_dump.bin`
        (byte offset / 256 = sector). Known values: MT6781/MT6769Z = 57344,
        MT6833 gold = 65504, MT6833 light = 57344, MT6877 = 57344. MT6833 varies by LK
        family (gold vs light), do not assume a value, always grep. Leave as "n/a" if you
        took Path B (seccfg only).
      placeholder: 'e.g. 57344, grep returned 14680064 and 31457280 (16 MiB alias), erased the lowest'
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Storage identifier (UFS ID or EMMC ID)
      description: >-
        From the mtkclient log, the `DAXFlash - UFS ID:` or `DAXFlash - EMMC ID:` line.
        This matters for the compatibility database, but storage type alone does not
        predict success: current same-family reports differ by LK build and boot-chain
        behavior as well as storage implementation.
      placeholder: 'e.g. UFS KM8L9001JM-B62 or EMMC Y2P064'
    validations:
      required: false
  - type: input
    id: active_slot
    attributes:
      label: Active slot (a/b) and LK build string
      description: >-
        Output of `fastboot getvar current-slot` and the LK build string from your
        active slot. Grep: `strings lk_a.bin | grep -E '^<codename>-'` or run
        `scan_lk.py` which reports it. Required for the LK-build-indexed compatibility
        entry, since the same codename can carry different LK generations across OTAs.
      placeholder: 'e.g. slot a, light-072f5dbd2-20231011161345-20250722115219'
    validations:
      required: false
  - type: dropdown
    id: persistent
    attributes:
      label: Persistent after reboot?
      options:
        - "Yes — still unlocked after reboot"
        - "No — relocked after reboot"
        - "Not tested yet"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: "Any issues, errors, or observations"
    validations:
      required: false
