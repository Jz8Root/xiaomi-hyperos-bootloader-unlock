name: Device Test Report
description: Report your unlock result to add your device to the compatibility database
title: "[DEVICE] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Fill in all fields — this data goes directly into COMPATIBILITY.md.
  - type: input
    id: device
    attributes:
      label: Device model
      description: "Full model name (e.g. Redmi Note 11S)"
      placeholder: "Redmi Note 11S"
    validations:
      required: true
  - type: input
    id: codename
    attributes:
      label: Codename
      description: "Device codename (e.g. miel, fleur, camellia)"
      placeholder: "miel"
    validations:
      required: true
  - type: input
    id: soc
    attributes:
      label: SoC
      description: "MediaTek SoC (e.g. MT6781, MT6833)"
      placeholder: "MT6781"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: "Full firmware string (e.g. HyperOS OS1.0.9.0.TKEEUXM)"
      placeholder: "HyperOS OS1.0.9.0.TKEEUXM"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Unlock result
      options:
        - SUCCESS — unlocked
        - FAILED — still locked after procedure
        - PARTIAL — unlocked but issue (describe below)
    validations:
      required: true
  - type: textarea
    id: fastboot_output
    attributes:
      label: fastboot oem lks output
      description: "Paste the output of `fastboot oem lks` and `fastboot getvar unlocked` after the procedure"
      render: shell
    validations:
      required: true
  - type: textarea
    id: commands_used
    attributes:
      label: Commands used
      description: "The exact mtkclient commands you ran (with preloader if used)"
      render: shell
    validations:
      required: true
  - type: input
    id: rpmb_sector
    attributes:
      label: RPMB sector erased (Path A only)
      description: >-
        Which sector did you erase, and how did you find it? There is no default value,
        the sector is SoC-specific. Get yours with:
        `python3 mtk.py da rpmb r rpmb_dump.bin` then `grep -boa "Jz8PNRUF" rpmb_dump.bin`
        (byte offset / 256 = sector). Known values: MT6781/MT6769Z/MT6877 = 57344,
        MT6833 = 65504. Leave as "n/a" if you took Path B (seccfg only).
      placeholder: 'e.g. 57344, grep returned 14680064 and 31457280 (16 MiB alias), erased the lowest'
    validations:
      required: true
  - type: dropdown
    id: persistent
    attributes:
      label: Persistent after reboot?
      options:
        - "Yes — still unlocked after reboot"
        - "No — relocked after reboot"
        - "Not tested yet"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: "Any issues, errors, or observations"
    validations:
      required: false
